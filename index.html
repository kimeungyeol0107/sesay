
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중3 사회 문제 풀기</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Malgun Gothic",sans-serif;
 background:#f2f3f5;
 color:#222;
}
button{cursor:pointer;font-family:inherit}
#startScreen{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.startBox{
 background:white;
 width:100%;
 max-width:600px;
 padding:40px 25px;
 border-radius:18px;
 text-align:center;
 box-shadow:0 5px 25px #00000010;
}
.startBox h1{font-size:30px;margin-bottom:12px}
.startBox p{color:#777}
.mainBtn{
 border:0;
 background:#222;
 color:white;
 padding:15px 30px;
 border-radius:9px;
 font-size:16px;
 margin:10px 5px;
}
.mainBtn:hover{background:#444}
#difficulty{
 display:none;
 text-align:left;
 background:#f5f5f5;
 padding:18px;
 border-radius:10px;
 margin:20px 0;
 line-height:2;
}
#quizScreen{display:none;max-width:850px;margin:auto;padding:15px}
.top{
 position:sticky;
 top:0;
 z-index:10;
 background:#fff;
 padding:14px;
 border-radius:12px;
 box-shadow:0 3px 12px #00000012;
 margin-bottom:20px;
}
.topRow{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
#timer{
 font-size:25px;
 font-weight:bold;
 font-variant-numeric:tabular-nums;
}
#timer.danger{color:#e22}
.progress{
 height:7px;
 background:#eee;
 border-radius:10px;
 overflow:hidden;
 margin-top:12px;
}
#progressBar{
 height:100%;
 width:0%;
 background:#333;
 transition:.2s;
}
.question{
 background:white;
 border-radius:13px;
 padding:22px;
 margin-bottom:17px;
 box-shadow:0 2px 9px #00000008;
}
.qTitle{
 font-weight:bold;
 font-size:17px;
 line-height:1.6;
 margin-bottom:17px;
 white-space:pre-wrap;
}
.level{
 display:inline-block;
 background:#eee;
 padding:4px 9px;
 border-radius:5px;
 font-size:12px;
 margin-bottom:10px;
}
.choice{
 display:flex;
 align-items:flex-start;
 gap:10px;
 padding:13px 12px;
 border:1px solid #e5e5e5;
 border-radius:8px;
 margin:8px 0;
 cursor:pointer;
 line-height:1.55;
 transition:.15s;
}
.choice:hover{background:#f7f7f7}
.choice.selected{
 background:#ededed;
 border-color:#333;
}
.choice input{
 margin-top:4px;
 accent-color:#222;
}
.submitArea{text-align:center;padding:20px 0 40px}
#submitBtn{
 width:100%;
 max-width:350px;
 padding:17px;
 border:0;
 background:#222;
 color:white;
 border-radius:10px;
 font-size:18px;
 font-weight:bold;
}
#submitBtn:disabled{background:#aaa;cursor:not-allowed}
#remaining{font-size:13px;color:#777;margin-top:12px}
#resultScreen{
 display:none;
 max-width:750px;
 margin:30px auto;
 padding:15px;
}
.resultBox{
 background:white;
 border-radius:15px;
 padding:28px 20px;
 text-align:center;
 box-shadow:0 3px 15px #00000010;
}
.score{font-size:48px;font-weight:bold;margin:20px 0}
.resultStats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin:25px 0;
}
.stat{
 background:#f4f4f4;
 padding:15px 5px;
 border-radius:9px;
}
.stat strong{display:block;font-size:22px;margin-bottom:7px}
.stat span{font-size:12px;color:#777}
.review{
 text-align:left;
 margin-top:25px;
}
.reviewItem{
 border-top:1px solid #eee;
 padding:17px 5px;
 line-height:1.7;
}
.correct{color:#16834b;font-weight:bold}
.wrong{color:#d33;font-weight:bold}
.explain{color:#555;font-size:14px}
@media(max-width:500px){
 .startBox h1{font-size:25px}
 .question{padding:17px}
 .qTitle{font-size:16px}
 .resultStats{grid-template-columns:1fr}
 .stat{display:flex;justify-content:space-between;align-items:center}
 .stat strong{margin:0}
}
</style>
</head>
<body>

<div id="startScreen">
 <div class="startBox">
  <h1>중3 사회 문제 풀기</h1>
  <p>사회 실력 테스트</p>
  <p>총 18문제 · 100점 · 제한시간 25분</p>

  <button class="mainBtn" onclick="showDifficulty()">난이도 보기</button>

  <div id="difficulty">
   <strong>문제 난이도</strong><br>
   1번 ~ 5번 : 하<br>
   6번 ~ 10번 : 중<br>
   11번 ~ 15번 : 상<br>
   16번 ~ 18번 : 최상
  </div>

  <button class="mainBtn" onclick="startQuiz()">시험 시작하기</button>
 </div>
</div>

<div id="quizScreen">
 <div class="top">
  <div class="topRow">
   <strong>중3 사회 모의고사</strong>
   <div id="timer">25:00</div>
  </div>
  <div class="topRow" style="margin-top:7px;font-size:13px;color:#777">
   <span id="answered">응답 0 / 18</span>
   <span>총 100점</span>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
 </div>

 <div id="questions"></div>

 <div class="submitArea">
  <button id="submitBtn" onclick="finishQuiz()" disabled>
   모든 문제를 풀어주세요
  </button>
  <div id="remaining">18문제에 모두 답해야 제출할 수 있습니다.</div>
 </div>
</div>

<div id="resultScreen">
 <div class="resultBox">
  <h2>시험 결과</h2>
  <p>중3 사회 문제 풀이가 완료되었습니다.</p>
  <div class="score" id="scoreDisplay">0점</div>

  <div class="resultStats">
   <div class="stat">
    <strong id="correctCount">0 / 18</strong>
    <span>맞힌 문제</span>
   </div>
   <div class="stat">
    <strong id="elapsed">0분 0초</strong>
    <span>소요 시간</span>
   </div>
   <div class="stat">
    <strong id="wrongCount">0개</strong>
    <span>틀린 문제</span>
   </div>
  </div>

  <h3 id="grade"></h3>
  <p id="timeoutText"></p>

  <div class="review">
   <h3>정답 및 채점 결과</h3>
   <div id="answerReview"></div>
  </div>
 </div>
</div>

<script>
const originalQuestions = [
{
 q:"시장 판매를 목적으로 상품성 높은 작물을 재배하는 농업 방식을 뭐라고 하나요?",
 p:3,level:"하",
 a:["대규모농업","상업적농업","플랜테이션","상업허가농업","자급적농업"],
 c:1
},
{
 q:"기업적 농업의 의미로 알맞은 것을 보기에서 찾아 모두 고르시오.\n\n<보기>\nㄱ. 많은 자본이 들어간다.\nㄴ. 많은 인력이 들어간다.\nㄷ. 이윤 창출을 목표로 한다.",
 p:3,level:"하",
 a:["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
 c:2
},
{
 q:"단일 작물재배의 단점으로 옳지 않은 것을 고르시오.",
 p:3,level:"하",
 a:["삼림이 파괴된다.","농약이 과도하게 사용된다.","국제 가격 변동에 큰 영향을 받는다.","생산효율이 높다.","토양 양분이 불균형해진다."],
 c:3
},
{
 q:"다국적 기업의 설명으로 옳지 않은 것을 고르시오.",
 p:3,level:"하",
 a:[
 "본사를 한 국가에 두고, 세계 여러 나라에 지사나 현지 법인을 세워 생산과 판매 활동을 하는 기업을 말한다.",
 "원료 조달과 연구 개발, 생산, 판매를 전 세계에서 가장 유리한 국가를 선택해 나누어 진행한다.",
 "거대한 자본력과 첨단 기술을 바탕으로 세계 경제와 무역에 매우 큰 영향을 미친다.",
 "진출한 국가의 문화와 소비자의 취향에 맞추어 제품이나 마케팅 방식을 다르게 적용하는 경우가 많다.",
 "모든 제품은 반드시 본사가 있는 나라의 공장에서만 생산한 뒤, 외국으로 수출하여 판매하기만 한다."
 ],
 c:4
},
{
 q:"다국적 기업의 예시로 옳지 않은 것을 구하시오.",
 p:3,level:"하",
 a:[
 "지산전자: 한국에 본사를 두고 있지만, 인건비가 저렴한 베트남에 스마트폰 생산 공장을 세우고 미국과 유럽에 연구소를 운영하고 있습니다.",
 "킹버거: 미국에 본사를 둔 패스트푸드 기업으로, 전 세계 80여 개국에 지사를 세우고 각 나라의 종교와 식문화를 반영한 현지화 메뉴를 판매합니다.",
 "캬아자동차: 한국에 본사를 두고 있으며, 관세 장벽을 피하고 현지 시장에 빠르게 대응하기 위해 미국 앨라배마주와 체코에 현지 조립 공장을 운영합니다.",
 "선신단: 한국 내 특정 시·군 지역에만 3개의 매장을 운영하며, 해외에는 지사나 생산 공장 없이 국내 소비자를 대상으로만 빵을 만들어 판매하고 있습니다.",
 "스우에덴가구: 스웨덴에 본사를 둔 가구 기업으로, 디자인은 본사에서 총괄하지만 원자재 조달과 제작은 동남아시아 공장에서 진행하며 전 세계 매장에서 판매합니다."
 ],
 c:3
},
{
 q:"산업공동화의 현상으로 옳지 않은 것을 고르시오.",
 p:4,level:"중",
 a:[
 "선진국 기업들이 인건비나 지대 등 생산 비용을 줄이기 위해 생산 기지를 해외로 이전하면서 발생한다.",
 "제조업 생산 시설이 해외로 이전하면서 도심의 상주인구가 감소하고 주거 기능이 약화되는 현상을 말한다.",
 "국내 제조업 공장들이 문을 닫거나 해외로 빠져나가면서 제조업 부문의 일자리가 크게 줄어든다.",
 "제조업 비중이 축소되는 대신 서비스업과 금융업 등 제3차 산업 중심으로 국내 경제 구조가 재편된다.",
 "핵심 부품 생산이나 연구개발 기능까지 해외로 이전될 경우 국내 산업의 장기적인 경쟁력이 약화될 수."
 ],
 c:1
},
{
 q:"서비스업의 세계화의 사례로 옳지 않은 것을 보기에서 찾아 모두 고르시오.\n\n<보기>\nㄱ. 한국의 A 성형외과는 해외 환자를 유치하기 위해 영어와 중국어 통역 서비스를 제공하고 현지 에이전시와 제휴를 맺었다. 또한 수술 후 본국으로 돌아간 환자를 위해 화상 통신을 활용한 비대면 사후 관리 시스템을 운영하고 있다.\n\nㄴ. 미국의 금융 기업 B 은행은 인건비 절감과 24시간 고객 응대를 위해 인도의 방갈로르 지역에 대규모 고객 상담 콜센터를 설립했다. 동시에 아시아 시장 확대를 위해 싱가포르에 현지 지사를 세워 직접 금융 상품을 판매하고 있다.\n\nㄷ. 한국의 의류 기업 C 패션은 생산 비용을 절감하기 위해 해외 생산 기지를 확대하고, 현지에서 생산한 제품을 국내외 시장에 판매하고 있다.",
 p:4,level:"중",
 a:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
 c:1
},
{
 q:"서비스업이 성장할수록 물류산업도 함께 성장하는 이유로 옳지 않은 것을 고르시오.",
 p:4,level:"중",
 a:[
 "온라인 플랫폼과 전자상거래의 발달로 소비자가 직접 매장을 방문하지 않고 상품을 구매하는 경우가 늘어나면서, 소비자에게 상품을 전달하는 배송 서비스의 중요성이 커지기 때문이다.",
 "관광 및 숙박업이 성장하면서 호텔과 음식점에서 사용하는 식자재, 생활용품 등의 안정적인 공급을 위한 물류 수요가 증가하기 때문이다.",
 "유통업의 규모가 확대되면 상품의 종류와 판매 지역이 다양해지므로, 상품을 보관하고 분류하여 적절한 장소로 이동시키는 물류 기능이 더욱 중요해지기 때문이다.",
 "금융업과 정보통신업 등 비물질적인 서비스를 제공하는 산업이 성장하면 해당 산업의 거래 규모에 비례하여 상품의 국제 운송량도 반드시 증가하기 때문이다.",
 "의료 및 복지 서비스가 확대되면 의약품과 의료기기, 각종 의료 소모품 등을 필요한 장소에 적시에 공급해야 하므로 물류산업의 역할도 중요해지기 때문이다."
 ],
 c:3
},
{
 q:"지구온난화로 인해 나타나는 현상으로 옳지 않은 것을 고르시오.",
 p:4,level:"중",
 a:[
 "해수 온도가 상승하면서 해수의 열팽창이 발생하고, 빙하가 녹으면서 전 세계적인 해수면 상승에 영향을 미친다.",
 "고위도 지역의 영구 동토층이 녹으면서 땅이 불안정해지고, 토양 속에 저장되어 있던 온실가스가 대기 중으로 방출될 수 있다.",
 "기온 상승으로 증발량이 증가하면서 일부 지역에서는 가뭄이 심해지는 반면, 대기 중 수증기 증가로 강수량이 증가하는 지역도 나타날 수 있다.",
 "지구 평균 기온이 상승하면 해양의 수온도 함께 높아지므로, 해수의 산소 용해도가 증가하여 해양 생태계의 산소 부족 문제가 완화된다.",
 "고산 지대와 극지방의 빙하가 감소하면서 빙하에 의존하는 생물들의 서식 환경이 변화하고, 생태계의 균형이 무너질 수."
 ],
 c:3
},
{
 q:"온실효과에 대한 설명으로 옳은 것을 고르시오.",
 p:4,level:"중",
 a:[
 "지표면이 태양 에너지를 흡수한 뒤 방출하는 적외선의 일부를 대기 중 온실가스가 흡수하고 다시 방출하여 지구의 평균 기온을 유지하는 현상이다.",
 "태양에서 들어오는 단파 복사 에너지가 대기 중 온실가스에 대부분 흡수되어 지표면에 도달하지 못하는 현상이다.",
 "대기 중 이산화탄소와 메탄의 농도가 감소할수록 지표면에서 방출되는 열에너지가 대기에 더 많이 갇혀 지구의 평균 기온이 상승하는 현상이다.",
 "온실효과는 인간의 산업 활동으로 인해 처음 발생한 현상으로, 산업혁명 이전에는 지구 대기에 온실효과가 존재하지 않았다.",
 "온실효과가 강해질수록 지구에서 우주로 방출되는 에너지가 증가하므로 지구의 평균 기온은 점차 낮아진다."
 ],
 c:0
},
{
 q:"기업적 농업의 특징과 식량 자급률에 대한 설명으로 가장 적절하지 않은 것을 고르시오.",
 p:7,level:"상",
 a:[
 "기업적 농업은 대규모 자본과 첨단 기술을 활용하여 농산물을 생산하며, 시장에서의 판매와 이윤 창출을 주요 목적으로 한다.",

let questions=[];
let answers={};
let startTime=0;
let timerInterval=null;
let remaining=25*60;
let finished=false;

function shuffle(array){
 let a=[...array];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function showDifficulty(){
 document.getElementById("difficulty").style.display="block";
}

function startQuiz(){
 questions=originalQuestions.map((q,index)=>{
  let options=q.a.map((v,i)=>({text:v,correct:i===q.c}));
  options=shuffle(options);
  return {...q,options};
 });

 document.getElementById("startScreen").style.display="none";
 document.getElementById("quizScreen").style.display="block";

 const area=document.getElementById("questions");
 area.innerHTML="";

 questions.forEach((q,index)=>{
  let div=document.createElement("div");
  div.className="question";
  div.id="q"+index;

  let html=`
   <div class="level">${q.level} 난이도 · ${q.p}점</div>
   <div class="qTitle">문제 ${index+1}. [${q.p}점]<br><br>${escapeHTML(q.q)}</div>
  `;

  q.options.forEach((option,j)=>{
   html+=`
    <label class="choice" id="choice-${index}-${j}">
     <input type="radio" name="q${index}" value="${j}"
       onchange="selectAnswer(${index},${j})">
     <span>${j+1}. ${escapeHTML(option.text)}</span>
    </label>
   `;
  });

  div.innerHTML=html;
  area.appendChild(div);
 });

 startTime=Date.now();
 remaining=1500;
 updateTimer();
 timerInterval=setInterval(tick,1000);
 updateProgress();
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function selectAnswer(index,choice){
 if(finished)return;
 answers[index]=choice;

 for(let j=0;j<5;j++){
  const el=document.getElementById(`choice-${index}-${j}`);
  el.classList.toggle("selected",j===choice);
 }
 updateProgress();
}

function updateProgress(){
 const count=Object.keys(answers).length;
 document.getElementById("answered").textContent=`응답 ${count} / 18`;
 document.getElementById("progressBar").style.width=(count/18*100)+"%";

 const btn=document.getElementById("submitBtn");
 const remain=document.getElementById("remaining");

 if(count===18){
  btn.disabled=false;
  btn.textContent="시험 제출 및 채점하기";
  remain.textContent="모든 문제에 답하셨습니다. 제출할 수 있습니다.";
 }else{
  btn.disabled=true;
  btn.textContent=`모든 문제를 풀어주세요 (${count}/18)`;
  remain.textContent=`아직 ${18-count}문제가 남았습니다.`;
 }
}

function tick(){
 if(finished)return;
 remaining--;
 updateTimer();
 if(remaining<=0){
  remaining=0;
  clearInterval(timerInterval);
  finishQuiz(true);
 }
}

function updateTimer(){
 const m=Math.floor(remaining/60);
 const s=remaining%60;
 const el=document.getElementById("timer");
 el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
 el.classList.toggle("danger",remaining<=300);
}

function finishQuiz(timeout=false){
 if(finished)return;

 if(!timeout&&Object.keys(answers).length!==18)return;

 finished=true;
 clearInterval(timerInterval);

 const elapsedSeconds=Math.min(
  1500,Math.floor((Date.now()-startTime)/1000)
 );

 let correct=0;
 let score=0;
 let review="";

 questions.forEach((q,index)=>{
  const selected=answers[index];
  const correctIndex=q.options.findIndex(o=>o.correct);
  const isCorrect=selected!==undefined&&q.options[selected].correct;

  if(isCorrect){
   correct++;
   score+=q.p;
  }

  const selectedText=selected===undefined
   ?"미응답"
   :`${selected+1}. ${q.options[selected].text}`;

  const correctText=`${correctIndex+1}. ${q.options[correctIndex].text}`;

  review+=`
   <div class="reviewItem">
    <strong>문제 ${index+1} (${q.p}점)</strong><br>
    <span class="${isCorrect?"correct":"wrong"}">
     ${isCorrect?"정답":"오답"}
    </span>
    ${selected===undefined?"· 미응답":""}
    <div class="explain">내 답: ${escapeHTML(selectedText)}</div>
    <div class="explain">정답: ${escapeHTML(correctText)}</div>
   </div>
  `;
 });

 const minutes=Math.floor(elapsedSeconds/60);
 const seconds=elapsedSeconds%60;

 document.getElementById("quizScreen").style.display="none";
 document.getElementById("resultScreen").style.display="block";

 document.getElementById("scoreDisplay").textContent=score+"점";
 document.getElementById("correctCount").textContent=correct+" / 18";
 document.getElementById("wrongCount").textContent=(18-correct)+"개";
 document.getElementById("elapsed").textContent=
  `${minutes}분 ${seconds}초`;
 document.getElementById("answerReview").innerHTML=review;

 let grade="";
 if(score>=90)grade="우수한 성적입니다!";
 else if(score>=80)grade="좋은 성적입니다!";
 else if(score>=70)grade="양호한 성적입니다.";
 else if(score>=60)grade="조금 더 공부해 보세요.";
 else grade="복습이 필요합니다.";

 document.getElementById("grade").textContent=grade;
 document.getElementById("timeoutText").textContent=
  timeout?"제한 시간 25분이 종료되어 자동 제출되었습니다.":"시험을 정상적으로 제출했습니다.";

 window.scrollTo(0,0);
}
</script>
